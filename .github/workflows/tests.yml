name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  # Keep matplotlib headless on the runners; `tests/conftest.py` also selects
  # the Agg backend, this is the belt and braces of the two.
  MPLBACKEND: Agg
  # numba, pulled in by umap-learn, caches its compiled kernels next to the
  # installed package by default, which fails when that directory is missing
  # or not writable. A dedicated cache directory keeps the run independent of
  # how the environment was installed.
  NUMBA_CACHE_DIR: ${{ runner.temp }}/numba-cache

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # The primary development platform and macOS are covered on a single
          # version, which keeps the matrix at seven cells instead of fifteen.
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package and its test extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Show the resolved dependency versions
        run: python -m pip list

      - name: Run the test suite
        run: python -m pytest -v

  lowest-direct:
    name: Lowest declared dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: Install the lowest versions allowed by requirements.txt
        # Without this job the lower bounds in `requirements.txt` are claims
        # that nothing ever checks.
        run: |
          uv venv --python 3.10
          uv pip install --resolution lowest-direct -e ".[test]"

      - name: Show the resolved dependency versions
        run: uv pip list

      - name: Run the test suite
        run: .venv/bin/python -m pytest -v
